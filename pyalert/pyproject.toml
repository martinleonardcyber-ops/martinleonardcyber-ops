[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyalert"
version = "0.1.0"
description = "Send beautiful alerts to Discord, Slack, Telegram and more with just one line of code"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Léo Martin", email = "martin.leonard.cyber@icloud.com"}
]
keywords = ["alerts", "notifications", "discord", "slack", "telegram", "webhook", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/martinleonardcyber-ops/pyalert"
Documentation = "https://github.com/martinleonardcyber-ops/pyalert#readme"
Repository = "https://github.com/martinleonardcyber-ops/pyalert"
Issues = "https://github.com/martinleonardcyber-ops/pyalert/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pyalert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.ruff]
line-length = 100
target-version = "py38"
